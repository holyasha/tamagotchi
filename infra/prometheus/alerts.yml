groups:
  - name: tamagotchi-recommendations
    rules:
      - record: tamagotchi:recommendation_requests:rate1m
        expr: sum(rate(http_server_requests_seconds_count{job="recommendation-service",method="GET",uri="/internal/recommendations/{petId}",status=~"2..|5.."}[1m]))
      - record: tamagotchi:recommendation_errors:rate1m
        expr: sum(rate(http_server_requests_seconds_count{job="recommendation-service",method="GET",uri="/internal/recommendations/{petId}",status=~"5.."}[1m])) or (0 * tamagotchi:recommendation_requests:rate1m)
      - record: tamagotchi:recommendation_error_ratio:rate1m
        expr: tamagotchi:recommendation_errors:rate1m / tamagotchi:recommendation_requests:rate1m
      - record: tamagotchi:recommendation_requests:increase1m
        expr: sum(increase(http_server_requests_seconds_count{job="recommendation-service",method="GET",uri="/internal/recommendations/{petId}",status=~"2..|5.."}[1m]))
      - record: tamagotchi:recommendation_good_ratio:rate5m
        expr: |
          (sum(rate(http_server_requests_seconds_bucket{job="recommendation-service",method="GET",uri="/internal/recommendations/{petId}",status="200",le="0.5"}[5m]))
          or (0 * sum(rate(http_server_requests_seconds_count{job="recommendation-service",method="GET",uri="/internal/recommendations/{petId}",status=~"2..|5.."}[5m]))))
          / sum(rate(http_server_requests_seconds_count{job="recommendation-service",method="GET",uri="/internal/recommendations/{petId}",status=~"2..|5.."}[5m]))
      - alert: TamagotchiRecommendationHighErrorRatio
        expr: tamagotchi:recommendation_error_ratio:rate1m > 0.2 and tamagotchi:recommendation_requests:increase1m >= 10
        for: 20s
        labels:
          job: recommendation-service
          severity: warning
          team: tamagotchi
        annotations:
          summary: "Высокая доля ошибок при получении рекомендаций питомца"
          description: "Доля HTTP 5xx выше 20% за минуту при объёме не менее 10 запросов."
          dashboard_url: "http://localhost:3000/d/tamagotchi-observability"
          runbook_url: "http://localhost:3000/d/tamagotchi-observability?viewPanel=9"
      - alert: TamagotchiScrapeTargetDown
        expr: up{job=~"gateway-service|pet-service|recommendation-service"} == 0
        for: 30s
        labels:
          severity: warning
          team: tamagotchi
        annotations:
          summary: "Prometheus не получает метрики сервиса {{ $labels.job }}"
          dashboard_url: "http://localhost:3000/d/tamagotchi-observability"
