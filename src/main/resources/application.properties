spring.application.name=tamagotchi-pet-service
server.port=${SERVER_PORT:8080}
spring.datasource.url=${TAMAGOTCHI_DB_URL:jdbc:postgresql://localhost:5432/tamagotchi}
spring.datasource.username=${DB_USER:course}
spring.datasource.password=${DB_PASSWORD:course-dev-only}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Session and cookie settings for practical work 02
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
